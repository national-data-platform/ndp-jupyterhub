apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j-db-group-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j-db-group-1
  template:
    metadata:
      labels:
        app: neo4j-db-group-1
    spec:
      containers:
        - name: neo4j-db-group-1
          image: neo4j:latest
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: "neo4j/test1234"
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          volumeMounts:
            - name: neo4jdata
              mountPath: /data
          resources:
            limits:
              cpu: "8"
              memory: 32Gi
            requests:
              cpu: "8"
              memory: 32Gi
      volumes:
        - name: neo4jdata
          persistentVolumeClaim:
            claimName: neo4j-pvc-group-1
---
