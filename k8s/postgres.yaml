# Secret — generate password with: openssl rand -hex 16
# Used by both the PostgreSQL pod and the hub (via JUPYTERHUB_DB_PASS env var)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ndp-test
stringData:
  password: ""  # Generate with: openssl rand -hex 16
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ndp-test
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: rook-ceph-block
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ndp-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          env:
            - name: POSTGRES_DB
              value: jupyterhub
            - name: POSTGRES_USER
              value: jupyterhub
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ndp-test
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
