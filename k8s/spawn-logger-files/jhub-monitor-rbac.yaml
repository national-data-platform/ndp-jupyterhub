---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jhub-spawn-monitor
  namespace: ndp
  labels:
    app: jhub-spawn-watcher

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jhub-spawn-monitor
  namespace: ndp
  labels:
    app: jhub-spawn-watcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jhub-spawn-monitor
  namespace: ndp
  labels:
    app: jhub-spawn-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jhub-spawn-monitor
subjects:
  - kind: ServiceAccount
    name: jhub-spawn-monitor
    namespace: ndp