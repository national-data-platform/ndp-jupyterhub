---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jhub-spawn-watcher
  namespace: ndp
  labels:
    app: jhub-spawn-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jhub-spawn-watcher
  template:
    metadata:
      labels:
        app: jhub-spawn-watcher
    spec:
      serviceAccountName: jhub-spawn-monitor
      initContainers:
        - name: install-kubectl
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - apt-get update -qq &&
              apt-get install -y -qq curl &&
              curl -LO "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" &&
              chmod +x kubectl &&
              mv kubectl /tools/kubectl &&
              echo "kubectl installed ok"
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: watcher
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/watcher.sh"]
          env:
            - name: NAMESPACE
              value: "ndp"
            - name: SPAWN_TIMEOUT
              value: "300"
            - name: PATH
              value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: logs
              mountPath: /logs
            - name: tools
              mountPath: /tools
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
      volumes:
        - name: script
          configMap:
            name: jhub-spawn-watcher-script
            defaultMode: 0755
        - name: logs
          persistentVolumeClaim:
            claimName: jhub-monitor-logs
        - name: tools
          emptyDir: {}